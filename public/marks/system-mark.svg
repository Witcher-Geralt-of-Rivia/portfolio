    <path d="M22 11 L18 22" />
    <path d="M18 22 L6 18" />
    <path d="M12 7 L18 22" />
  </g>
  <g stroke="#515666" stroke-opacity="0.42" stroke-width="0.8">
    <circle cx="6" cy="18" r="2.8" fill="#e9e0ff" />
    <circle cx="12" cy="7" r="2.5" fill="#dceeff" />
    <circle cx="22" cy="11" r="3" fill="#ddf5e8" />
    <circle cx="18" cy="22" r="2.6" fill="#f9dfeb" />
  </g>
  <circle cx="14.6" cy="14.2" r="1.35" fill="#191b24" opacity="0.78" />
