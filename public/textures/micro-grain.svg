<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Micro grain tile. Monochromatic fractal noise, generated locally.
       Purpose: dither the aurora gradients so they never read as digitally flat.
       Intensity is controlled at the page level by the grain opacity token. -->
  <filter id="microGrain"
          x="0" y="0" width="100%" height="100%"
          filterUnits="userSpaceOnUse"
          color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="4"
      stitchTiles="stitch"
      result="turbulence" />
    <!-- Flatten to a neutral mid-grey and derive alpha from luminance,
         so the tile carries no colour cast of its own. -->
    <feColorMatrix
      in="turbulence"
      type="matrix"
      values="0 0 0 0 0.5
              0 0 0 0 0.5
              0 0 0 0 0.5
              0.34 0.34 0.32 0 0"
      result="mono" />
    <!-- Expand the alpha spread so the tile dithers across a full
         quantisation step instead of clustering around mid-grey. -->
    <feComponentTransfer in="mono">
      <feFuncA type="linear" slope="1.9" intercept="-0.42" />
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#microGrain)" />
</svg>
